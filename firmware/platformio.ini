; PlatformIO Project Configuration File
; Persona 3 / Persona 3 Reload (P3R) Protagonist MP3 Player Firmware
; Default Target MCU (Plan A Taobao Kit): Waveshare ESP32-S3-Zero (No-Header Bare Board, Dual-Core 240MHz + Native USB 2.0 MSC U-Disk)
; Audio DAC: GY-PCM5102 (TI Burr-Brown PCM5102A 32-Bit/384kHz I2S Stereo Hi-Fi DAC)
; Display: 2.25" 76x284 ST7789P3 SPI Bar IPS/TFT (Rev 2)
; Storage: Permanent internal MicroSD Card (mounts as USB Flash Drive on PC via USBMSC!)

[platformio]
default_envs = waveshare-esp32-s3-zero

[env:waveshare-esp32-s3-zero]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio
board_build.partitions = default.csv

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DP3R_TARGET_ESP32S3_ZERO=1
    -DP3R_FIRMWARE_VERSION=\"2.4.0-REV24-AUDIO-ADC\"

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    esphome/ESP32-audioI2S @ ^2.0.7
