; PlatformIO Project Configuration File
; Persona 3 / Persona 3 Reload (P3R) Protagonist MP3 Player Firmware
; Target MCU: ESP32-PICO-MINI-02-N8R2 (8MB Flash, 2MB PSRAM)
; Audio DAC: PCM5102A (32-bit I2S DirectPath Stereo DAC)
; Display: 0.91" 128x32 SSD1306 Ice-Blue PMOLED (I2C)

[env:esp32-pico-mini-02]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DP3R_FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    olikraus/U8g2 @ ^2.35.9
    https://github.com/schreibfaul1/ESP32-audioI2S.git
    https://github.com/pschatzmann/ESP32-A2DP.git
