<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .silver-barrel {
      background: linear-gradient(90deg,
        #93a1b8 0%,
        #dbe4f3 24%,
        #f5f8fd 48%,
        #c7d4e8 74%,
        #7f8fa8 100%);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.45),
        inset 2px 0 3px rgba(255, 255, 255, 0.8),
        inset -3px 0 6px rgba(30, 45, 70, 0.45);
    }
    .navy-collar {
      background: linear-gradient(90deg,
        #1e2942 0%,
        #35466c 28%,
        #4e628e 48%,
        #2b395b 76%,
        #172036 100%);
      box-shadow: inset 1px 0 2px rgba(255,255,255,0.3);
    }
    .screen-bezel {
      background: linear-gradient(180deg, #6e7f99 0%, #8ea0bc 50%, #647590 100%);
      box-shadow:
        inset 2px 2px 4px rgba(15, 25, 45, 0.65),
        inset -1px -1px 2px rgba(255, 255, 255, 0.7);
    }
    .pill-btn {
      background: linear-gradient(90deg, #b8c7de 0%, #eef4fc 50%, #6d7d96 100%);
      border: 1px solid #3c4b64;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .pill-btn:hover {
      background: linear-gradient(90deg, #d4e3fa 0%, #ffffff 50%, #889bb8 100%);
    }
    .pill-btn:active, .pill-btn.pressed {
      transform: translateX(-2.5px);
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-2.5">
    <!-- Top Header & Cutscene Action Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-1.5 border-b border-[var(--card-border)] text-xs">
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold">P3R 开场动画 1:1 完美复刻 (Rev 2.6 全屏滚动版)</span>
        <span id="stateBadge" class="px-2 py-0.5 rounded border border-[var(--card-border)] text-[var(--muted-foreground)] font-mono">当前：Burn My Dread (01:36)</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="playFullCutsceneDemo()" class="px-2.5 py-1 rounded text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 transition">🚆 重演开场动画 (HELLO整体渐显 ➔ 全屏滚动切歌)</button>
        <button onclick="freezeMidRollFrame3()" class="px-2.5 py-1 rounded text-xs font-medium border border-[var(--card-border)] bg-[var(--card)] hover:border-[var(--primary)] transition">📸 定格图3「全屏上下滚动瞬间」</button>
        <button onclick="toggleDisplayPolarity()" class="px-2 py-1 rounded text-xs font-medium border border-[var(--card-border)] bg-[var(--card)] hover:border-[var(--primary)] transition">🌗 极性</button>
      </div>
    </div>

    <!-- Main Side-by-Side Workspace (Compact <= 410px height) -->
    <div class="grid grid-cols-12 gap-3 items-center bg-[var(--card)] border border-[var(--card-border)] rounded-xl p-3">

      <!-- Left 5 Cols: Vertical Portrait 1:1 P3R Opening MP3 Model -->
      <div class="col-span-5 flex flex-col items-center justify-center relative py-1">
        <div class="relative flex flex-col items-center">

          <!-- TOP ATTACHMENTS: Left-Offset Earphone Plug + Top Lanyard Clasp & Ring -->
          <div class="relative w-[86px] h-[38px] flex items-end justify-center">
            <svg class="absolute -top-3 -left-5 w-[70px] h-[52px] pointer-events-none" viewBox="0 0 70 52" fill="none">
              <path d="M12 48 C 10 20, 12 4, 24 4 C 34 4, 38 18, 40 34" stroke="#4f6185" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
            <!-- Left-offset Earphone Plug Boot -->
            <div class="w-[22px] h-[28px] rounded-t-md bg-gradient-to-r from-[#222f4d] via-[#41537a] to-[#1d2842] border border-[#141d30] -mr-1 z-10" title="左偏置 3.5mm 耳机插头护套 (对应主板 J3)"></div>

            <!-- Top-Center Lanyard Clasp Block + Metallic Split Ring -->
            <div class="relative w-[42px] h-[34px] rounded-t-sm bg-gradient-to-r from-[#38496e] via-[#586d99] to-[#273554] border border-[#1b263e] flex items-center justify-center">
              <div class="w-4 h-4 rounded-full border-[2.5px] border-[#b8c7e0] shadow-sm"></div>
              <div class="absolute -top-2 w-1.5 h-3.5 rounded-full bg-[#cbd8ed] border border-[#4a5b7d]"></div>
            </div>
          </div>

          <!-- SECTION 1: Top Dark-Navy Collar Barrel -->
          <div class="navy-collar w-[86px] h-[46px] rounded-t-sm border-x border-t border-[#162038] relative flex items-center justify-center">
            <div class="absolute left-0 top-0 bottom-1 w-[16px] bg-black/25 border-r border-white/10"></div>
          </div>

          <!-- SECTION 2: Central Brushed Silver Barrel + Recessed Screen + Right-Side 4 Oval Pill Buttons -->
          <div class="silver-barrel relative w-[86px] h-[178px] border-x border-[#5c6d87] flex items-center justify-center">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-[#3b4a63]"></div>
            <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-[#3b4a63]"></div>

            <!-- Recessed Rectangular Screen Bezel Frame -->
            <div class="screen-bezel w-[52px] h-[152px] rounded-[4px] p-[3px] flex items-center justify-center">
              <canvas id="p3rOledVert" width="38" height="144" class="w-[46px] h-[146px] rounded-[2px]"></canvas>
            </div>

            <!-- RIGHT-SIDE 4 PROTRUDING OVAL PILL BUTTONS -->
            <div class="absolute -right-[7px] top-[14px] bottom-[14px] w-[7px] flex flex-col justify-between py-1">
              <button id="pillBtn1" onclick="pressBtn(1)" class="pill-btn w-[7px] h-[24px] rounded-r-full cursor-pointer" title="侧键 1 (SW1)：播放 / 暂停"></button>
              <button id="pillBtn2" onclick="pressBtn(2)" class="pill-btn w-[7px] h-[28px] rounded-r-full cursor-pointer" title="侧键 2 (SW2)：下一曲 (全屏上下滚动翻页)"></button>
              <button id="pillBtn3" onclick="pressBtn(3)" class="pill-btn w-[7px] h-[24px] rounded-r-full cursor-pointer" title="侧键 3 (SW3)：上一曲 (全屏反向滚动翻页)"></button>
              <button id="pillBtn4" onclick="pressBtn(4)" class="pill-btn w-[7px] h-[22px] rounded-r-full cursor-pointer" title="侧键 4 (SW4)：短按EQ / 双击随机 / 中按(350..1000ms)灰蓝极性 / 长按(>=1s)U盘（网页点击演示 HELLO!）"></button>
            </div>
          </div>

          <!-- SECTION 3: Bottom Rounded Silver Dome Cap -->
          <div class="silver-barrel w-[86px] h-[44px] rounded-b-[26px] border-x border-b border-[#5c6d87] relative flex items-center justify-center" title="底部圆弧银色端盖（内藏 M1.6 同轴锁孔；向上拔出顶部深蓝顶帽即可露出 Type-C 与 MicroSD 卡槽）">
            <span class="text-[9px] font-mono text-[#3b4b66]/70 tracking-tighter">S.E.E.S.</span>
          </div>

        </div>
      </div>

      <!-- Right 7 Cols: Horizontal Enlarged Pixel-by-Pixel UI Inspection & Direct Controls -->
      <div class="col-span-7 space-y-3">
        <div class="space-y-1">
          <div class="flex items-center justify-between text-xs">
            <span class="font-semibold text-[var(--foreground)]">🔍 屏幕 UI 横向 1:1 像素放大检视 (128×32 点阵)</span>
            <span id="timeReadout" class="font-mono text-xs text-[var(--muted-foreground)]">01:36</span>
          </div>
          <!-- Horizontal Enlarged 128x32 Canvas -->
          <div class="p-3 rounded-lg bg-[#1a2436] border border-[#3a4b68] flex items-center justify-center shadow-inner">
            <canvas id="p3rOledHoriz" width="128" height="32" class="w-full max-w-[340px] h-[85px] rounded-[3px]" style="image-rendering: pixelated;"></canvas>
          </div>
        </div>

        <!-- 3-Frame Cutscene Verification Checklist -->
        <div class="grid grid-cols-3 gap-2 text-[11px] leading-snug bg-[var(--background)]/50 p-2.5 rounded-lg border border-[var(--card-border)]">
          <div>
            <span class="font-semibold text-[var(--primary)]">① 开机帧 (图2)：</span>
            <p class="text-[var(--muted-foreground)] mt-0.5">
              <code>HELLO!</code> <strong>作为一整幅图像</strong>，伴随柔和扫光与对比度渐显慢慢浮现。
            </p>
          </div>
          <div>
            <span class="font-semibold text-[var(--primary)]">② 静止帧 (图1)：</span>
            <p class="text-[var(--muted-foreground)] mt-0.5">
              左上 <code>▶</code> + <code>Burn My Dread</code> + 左下 <code>01:36</code> + 右上 <code>↻</code> 电池 + 右下 6 竖条。
            </p>
          </div>
          <div>
            <span class="font-semibold text-[var(--primary)]">③ 全屏翻页 (图3)：</span>
            <p class="text-[var(--muted-foreground)] mt-0.5">
              <strong>全屏所有元素一起上下滚动</strong>：顶部滚入半截 <code>Want To Be Cl...</code>，底部残留上一页边缘！
            </p>
          </div>
        </div>

        <!-- Interactive Side-Button Test Bar -->
        <div class="grid grid-cols-4 gap-1.5 pt-0.5">
          <button onclick="pressBtn(2)" class="px-2 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)]/15 border border-[var(--primary)] text-[var(--foreground)] hover:bg-[var(--primary)]/25 transition">⏭ 侧键2: 全屏下滚切歌</button>
          <button onclick="pressBtn(3)" class="px-2 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)]/15 border border-[var(--primary)] text-[var(--foreground)] hover:bg-[var(--primary)]/25 transition">⏮ 侧键3: 全屏上滚切歌</button>
          <button onclick="pressBtn(1)" class="px-2 py-1.5 rounded-lg text-xs font-medium bg-[var(--background)] border border-[var(--card-border)] hover:border-[var(--primary)] transition">⏯ 侧键1: 播放/暂停</button>
          <button onclick="playHelloSequence()" class="px-2 py-1.5 rounded-lg text-xs font-medium bg-[var(--background)] border border-[var(--card-border)] hover:border-[var(--primary)] transition">👋 侧键4: HELLO演示 (实机EQ/极性/U盘)</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const PLAYLIST = [
      { num: "01", title: "Burn My Dread",    dur: 96,  opTime: 96  }, // 01:36 (Screenshot 1)
      { num: "02", title: "Want To Be Cl...", dur: 153, opTime: 153 }, // 02:33 (Screenshot 3!)
      { num: "03", title: "Full Moon Ful...", dur: 292, opTime: 292 }, // 04:52 (P3R OP Theme)
      { num: "04", title: "It's Going Do...", dur: 186, opTime: 186 }, // 03:06
      { num: "05", title: "Mass Destruct...", dur: 204, opTime: 204 }, // 03:24
      { num: "06", title: "Color Your Ni...", dur: 227, opTime: 227 }, // 03:47
      { num: "07", title: "Memories of Y...", dur: 358, opTime: 358 }  // 05:58
    ];

    const cHoriz = document.getElementById("p3rOledHoriz");
    const ctxH = cHoriz.getContext("2d");
    const cVert = document.getElementById("p3rOledVert");
    const ctxV = cVert.getContext("2d");

    let trackIdx = 0;
    let prevTrackIdx = 0;
    let isPlaying = true;
    let isLoop = true;
    let animeIceLcdMode = true;
    let elapsed = 96;
    let prevElapsed = 96;

    // Whole-Screen Vertical Page-Roll State (Matches Frame 3 where ALL elements scroll together!)
    let isRolling = false;
    let freezeRoll = false;
    let rollDir = 1;       // +1 = whole screen rolls down (new page enters from top edge, matching Frame 3!)
    let rollProgress = 0;  // 0.0 to 1.0

    // Boot "HELLO!" Whole-Image Fade & Soft-Wipe State
    // helloFadeProgress: -1 = inactive; 0.0 -> 1.0 = whole graphic emerging smoothly
    let helloFadeProgress = -1;
    let cutsceneTimers = [];

    function clearCutsceneTimers() {
      cutsceneTimers.forEach(t => clearTimeout(t));
      cutsceneTimers = [];
    }

    function startWholeScreenRoll(newIdx, dir) {
      freezeRoll = false;
      prevTrackIdx = trackIdx;
      prevElapsed = elapsed;
      trackIdx = newIdx;
      rollDir = dir;
      rollProgress = 0.0;
      isRolling = true;
      elapsed = PLAYLIST[trackIdx].opTime;
      document.getElementById("stateBadge").textContent = `全屏翻页中：${PLAYLIST[prevTrackIdx].title} ➔ ${PLAYLIST[trackIdx].title}`;
    }

    // Freeze at the exact mid-roll frame shown in User's 3rd Screenshot:
    // The whole screen has rolled down by ~85% (yOff = -5px for new page "Want To Be Cl... / 02:33",
    // while the top of the outgoing page is just peeking at the very bottom edge yOff = +27px!)
    function freezeMidRollFrame3() {
      clearCutsceneTimers();
      helloFadeProgress = -1;
      prevTrackIdx = 0; // Burn My Dread
      prevElapsed = 96;
      trackIdx = 1;     // Want To Be Cl...
      elapsed = 153;    // 02:33
      rollDir = 1;
      rollProgress = 0.84; // Exact whole-screen vertical scroll position matching Screenshot 3!
      isRolling = true;
      freezeRoll = true;
      document.getElementById("stateBadge").textContent = "定格图3：全屏滚动瞬间 (顶部切半 + 底部残留上一页顶边)";
    }

    function playHelloSequence(onDone) {
      clearCutsceneTimers();
      freezeRoll = false;
      isRolling = false;
      helloFadeProgress = 0.0;
      document.getElementById("stateBadge").textContent = "开机动画：HELLO! 整体图像渐渐显现...";
      const totalSteps = 25;
      for (let step = 1; step <= totalSteps; step++) {
        cutsceneTimers.push(setTimeout(() => {
          helloFadeProgress = step / totalSteps;
        }, step * 38));
      }
      cutsceneTimers.push(setTimeout(() => {
        helloFadeProgress = -1;
        document.getElementById("stateBadge").textContent = `当前：${PLAYLIST[trackIdx].title}`;
        if (onDone) onDone();
      }, totalSteps * 38 + 680));
    }

    function playFullCutsceneDemo() {
      trackIdx = 0;
      elapsed = 96;
      playHelloSequence(() => {
        cutsceneTimers.push(setTimeout(() => {
          pressBtn(2); // Whole screen rolls vertically to "Want To Be Cl... (02:33)"
        }, 1100));
        cutsceneTimers.push(setTimeout(() => {
          pressBtn(2); // Whole screen rolls vertically to "Full Moon Ful... (04:52)"
        }, 2400));
      });
    }

    function pressBtn(n) {
      const btnEl = document.getElementById(`pillBtn${n}`);
      if (btnEl) {
        btnEl.classList.add("pressed");
        setTimeout(() => btnEl.classList.remove("pressed"), 140);
      }
      if (n === 1) {
        freezeRoll = false;
        isPlaying = !isPlaying;
      } else if (n === 2) {
        helloFadeProgress = -1;
        startWholeScreenRoll((trackIdx + 1) % PLAYLIST.length, +1);
      } else if (n === 3) {
        helloFadeProgress = -1;
        startWholeScreenRoll((trackIdx === 0) ? PLAYLIST.length - 1 : trackIdx - 1, -1);
      } else if (n === 4) {
        playHelloSequence();
      }
    }

    function toggleDisplayPolarity() {
      animeIceLcdMode = !animeIceLcdMode;
    }

    setInterval(() => {
      if (isPlaying && helloFadeProgress < 0 && !isRolling) {
        elapsed++;
        if (elapsed > PLAYLIST[trackIdx].dur + 30) {
          startWholeScreenRoll((trackIdx + 1) % PLAYLIST.length, +1);
        }
      }
    }, 1000);

    function drawRepeatIcon(ctx, x, y, fg) {
      ctx.strokeStyle = fg;
      ctx.lineWidth = 1.2;
      ctx.strokeRect(x, y, 8, 5);
      ctx.fillStyle = fg;
      ctx.fillRect(x + 6, y - 1, 2, 2);
      ctx.fillRect(x, y + 4, 2, 2);
    }

    // Draw an entire 128x32 screen page shifted vertically by `yOff` pixels
    function drawFullScreenPage(ctx, tIdx, timeSec, yOff, fg) {
      ctx.save();
      ctx.translate(0, yOff);
      ctx.fillStyle = fg;
      ctx.strokeStyle = fg;

      // 1. Top-Left Play/Pause Icon (X: 4..9, Y: 5..12)
      if (isPlaying) {
        ctx.beginPath();
        ctx.moveTo(4, 5); ctx.lineTo(4, 12); ctx.lineTo(9, 8.5); ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(4, 5, 2, 7);
        ctx.fillRect(7, 5, 2, 7);
      }

      // 2. Top-Center Track Title ("Burn My Dread" / "Want To Be Cl...")
      ctx.font = "bold 11px 'Segoe UI', Arial, sans-serif";
      ctx.fillText(PLAYLIST[tIdx].title, 14, 12);

      // 3. Top-Right Repeat Loop Icon `↻` + Outlined Battery Box
      if (isLoop) {
        drawRepeatIcon(ctx, 97, 6, fg);
      }
      ctx.lineWidth = 1.1;
      ctx.strokeRect(110, 6, 11, 5.5);
      ctx.fillRect(121, 7.5, 1.5, 2.5);

      // 4. Bottom-Left Elapsed Time (`01:36` / `02:33`)
      const mm = String(Math.floor(timeSec / 60)).padStart(2, "0");
      const ss = String(timeSec % 60).padStart(2, "0");
      ctx.font = "bold 9px 'Courier New', monospace";
      ctx.fillText(`${mm}:${ss}`, 14, 26);

      // 5. Bottom-Right Tiny "VOL" label + 6 Vertical Barcode Stripes (`||||||`)
      ctx.font = "bold 5px monospace";
      ctx.fillText("VOL", 84, 25);
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(97 + i * 2.2, 19, 1.2, 8);
      }

      ctx.restore();
    }

    function renderFrame() {
      const bg = animeIceLcdMode ? "#a5b8d4" : "#050b14";
      const fg = animeIceLcdMode ? "#253552" : "#00e5ff";

      ctxH.fillStyle = bg;
      ctxH.fillRect(0, 0, 128, 32);
      ctxH.fillStyle = fg;
      ctxH.strokeStyle = fg;

      // Mode A: Frame 2 ("H E L L O !" Whole-Graphic Smooth Fade + Progressive Reveal)
      if (helloFadeProgress >= 0) {
        const HELLO_CHARS = ["H", "E", "L", "L", "O", "!"];
        const CHAR_X = [18, 36, 54, 72, 90, 108];
        ctxH.save();
        // Smooth opacity + soft horizontal reveal across the entire graphic at once
        ctxH.globalAlpha = Math.min(1.0, helloFadeProgress * 1.15);
        const revealW = Math.floor(128 * Math.min(1.0, helloFadeProgress * 1.1));
        ctxH.beginPath();
        ctxH.rect(0, 0, revealW, 32);
        ctxH.clip();

        ctxH.font = "bold 18px 'Arial Narrow', 'Segoe UI', sans-serif";
        ctxH.scale(0.85, 1.15);
        for (let i = 0; i < 6; i++) {
          ctxH.fillText(HELLO_CHARS[i], CHAR_X[i] / 0.85, 20);
        }
        ctxH.restore();
      } else {
        // Mode B: Whole-Screen Vertical Page-Roll Transition (Matches Frame 3!)
        if (isRolling) {
          const shiftPx = rollProgress * 32;
          // Outgoing full page moves down by +shiftPx; Incoming full page enters from top (-32 + shiftPx)!
          const outYOff = rollDir * shiftPx;
          const inYOff  = -rollDir * (32 - shiftPx);

          drawFullScreenPage(ctxH, prevTrackIdx, prevElapsed, outYOff, fg);
          drawFullScreenPage(ctxH, trackIdx, elapsed, inYOff, fg);

          if (!freezeRoll) {
            rollProgress += 0.09; // Smooth 11-frame whole-screen vertical roll
            if (rollProgress >= 1.0) {
              isRolling = false;
              rollProgress = 0.0;
              document.getElementById("stateBadge").textContent = `当前：${PLAYLIST[trackIdx].title}`;
            }
          }
        } else {
          drawFullScreenPage(ctxH, trackIdx, elapsed, 0, fg);
        }

        const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const ss = String(elapsed % 60).padStart(2, "0");
        document.getElementById("timeReadout").textContent = `${mm}:${ss}`;
      }

      // Copy & Rotate 90 Degrees Clockwise onto the Vertical Portrait MP3 Screen (`p3rOledVert`)
      ctxV.save();
      ctxV.clearRect(0, 0, cVert.width, cVert.height);
      ctxV.translate(cVert.width, 0);
      ctxV.rotate(Math.PI / 2);
      ctxV.drawImage(cHoriz, 0, 0, cVert.height, cVert.width);
      ctxV.restore();
    }

    setInterval(renderFrame, 40);
    playFullCutsceneDemo();
  </script>
</body>
</html>
